  <style>
    :root {

      --text-dark: #1a202c;
      --text-muted: #4a5568;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gray);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, var(--nasa-dark) 0%, var(--nasa-blue) 100%);
      color: #ffffff;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .header h1 { margin: 0 0 0.5rem 0; font-size: 2.2rem; font-weight: 700; }
    .header p { margin: 0 auto; max-width: 750px; opacity: 0.9; font-size: 1.1rem; }
    .container {
      max-width: 1200px;
      margin: -2rem auto 3rem auto;
      padding: 0 1rem;
    }
    .filter-card {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border-gray);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1.5fr 1fr;
      gap: 1rem;
      align-items: flex-end;
    }
    @media (max-width: 900px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    .form-control {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border-gray);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-dark);
      background: #ffffff;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .table-container {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border-gray);
      overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border-gray); }
    th { background: #f1f5f9; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); }
    tr:hover { background-color: #f8fafc; }
    .sol-link { color: var(--nasa-blue); font-weight: 600; text-decoration: none; }
    .sol-link:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-open { background: #def7ec; color: #03543f; }
    .badge-closed { background: #f3f4f6; color: #374151; }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-gray);
      background: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .page-btn.active { background: var(--nasa-blue); color: #ffffff; border-color: var(--nasa-blue); }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

fy": "2002", "rel": "2002-03-18", "due": "--", "st": "Past", "type": "NRA", "docs": 2}, {"id": "524E4730-A788-74FB-D053-8529C1993FBF", "title": "Physical Sciences: Materials Science (NRA-01-OBPR-08-F)", "no": "NRA01OBPR08F", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2002-03-04", "due": "--", "st": "Past", "type": "NRA", "docs": 2}, {"id": "BF09CC36-43F7-7C39-6130-0F9CF34021DF", "title": "Physical Sciences: Fluid Physics (NRA-01-OBPR-08-D)", "no": "NRA01OBPR08D", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2002-02-09", "due": "--", "st": "Past", "type": "NRA", "docs": 3}, {"id": "E0A8511B-CA26-25BF-DD0F-2976845257A4", "title": "Physical Sciences: Fundamental Physics", "no": "NRA01OBPR08E", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2002-01-12", "due": "--", "st": "Past", "type": "NRA", "docs": 2}, {"id": "A4811788-16F6-AB94-F6DE-7EE1C0BA7705", "title": "Physical Sciences - Cellular and Macromolecular Biotechnology", "no": "NRA01OBPR08B", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2002-01-03", "due": "--", "st": "Past", "type": "NRA", "docs": 1}, {"id": "45EABBE1-7617-065E-A76B-D2D536C7314E", "title": "Physical Sciences - Combustion Science  (NRA-01-OBPR-08-C)", "no": "NRA01OBPR08C", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-12-21", "due": "--", "st": "Past", "type": "NRA", "docs": 3}, {"id": "C56519B4-6D45-BC79-45F3-E9CC12387B7D", "title": "Research Opportunities in Physical Sciences  (NRA-01-OBPR-08)", "no": "NRA01OBPR08", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-12-21", "due": "--", "st": "Past", "type": "NRA", "docs": 3}, {"id": "8371E8B0-6805-3EA3-726F-6678391BD23A", "title": "Multiple Opportunities for Ground-Based Research in Space Life Sciences (NRA-01-OBPR-07)", "no": "NRA01OBPR07", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-10-31", "due": "--", "st": "Past", "type": "NRA", "docs": 2}, {"id": "866F9CD0-B4F9-FF17-11B2-A8F6D5A4D55E", "title": "Fundamental Space Biology - Ground Based Research  (NRA-01-OBPR-06)", "no": "NRA01OBPR06", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-10-31", "due": "--", "st": "Past", "type": "NRA", "docs": 3}, {"id": "27EB4AFB-2291-EF61-7D31-ABFE887B20F6", "title": "Materials Science: Ground-based Research Opportunities in Biomaterials and Radiation Shielding (NRA-01-OBPR-05)", "no": "NRA01OBPR05", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-08-24", "due": "--", "st": "Past", "type": "NRA", "docs": 3}, {"id": "D8C687B5-45EB-F501-44C2-034D1F69FB54", "title": "NASA Specialized Center of Research and Training (NSCORT) (NRA-01-OBPR-04)", "no": "NRA01OBPR04", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-07-15", "due": "--", "st": "Past", "type": "NRA", "docs": 9}, {"id": "35858F8B-4C93-03E6-1CB8-E71E59C75CD0", "title": "NASA BioScience and Engineering Institute (CAN-01-OBPR-01)", "no": "CAN01OBPR01", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-07-09", "due": "--", "st": "Past", "type": "CAN", "docs": 4}, {"id": "8D4C8A93-1DA4-2E74-4924-515E944888C8", "title": "STS-107 Biospecimen Sharing Plan (AN-01-OBPR-04)", "no": "AN01OBPR04", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-06-22", "due": "--", "st": "Past", "type": "AN", "docs": 2}, {"id": "35E36947-6632-051D-85A9-8CC288EE346A", "title": "Microgravity Sciences: Fluid Physics (NRA-01-OBPR-02)", "no": "NRA01OBPR02", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-02-09", "due": "--", "st": "Past", "type": "NRA", "docs": 2}, {"id": "13F64274-C6EB-C71D-BCDE-218502E22EC9", "title": "Advanced Human Support Technology Program(NRA-01-OBPR-01)", "no": "NRA01OBPR01", "dir": "Office of Biological and Physical Research", "fy": "2001", "rel": "2001-01-26", "due": "--", "st": "Past", "type": "NRA", "docs": 2}];
    let filteredRecords = allRecords;
    let currentPage = 1;
    const pageSize = 30;

    const searchInput = document.getElementById('searchInput');
    const fySelect = document.getElementById('fySelect');
    const dirSelect = document.getElementById('dirSelect');
    const statusSelect = document.getElementById('statusSelect');
    const tableBody = document.getElementById('solTableBody');
    const resultCount = document.getElementById('resultCount');
    const pagination = document.getElementById('paginationControls');

    function filterData() {
      const query = searchInput.value.toLowerCase().trim();
      const fy = fySelect.value;
      const dir = dirSelect.value;
      const status = statusSelect.value;

      filteredRecords = allRecords.filter(r => {
        if (query && !r.title.toLowerCase().includes(query) && !r.no.toLowerCase().includes(query)) return false;
        if (fy && r.fy !== fy) return false;
        if (dir && r.dir !== dir) return false;
        if (status && r.st !== status) return false;
        return true;
      });

      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      resultCount.textContent = `Showing ${filteredRecords.length} of ${allRecords.length} solicitations`;
      const start = (currentPage - 1) * pageSize;
      const pageItems = filteredRecords.slice(start, start + pageSize);

      tableBody.innerHTML = pageItems.map(item => {
        const isClosed = item.st.toLowerCase().includes('closed') || item.st.toLowerCase().includes('past');
        const badgeCls = isClosed ? 'badge-closed' : 'badge-open';
        return `
          <tr>
            <td>
              <a href="solicitations/${item.id}" class="sol-link">${item.title}</a>
              ${item.docs > 0 ? `<div style="font-size:0.75rem; color:#64748b; margin-top:2px;">📄 ${item.docs} document${item.docs > 1 ? 's' : ''}</div>` : ''}
            </td>
            <td><strong>${item.no || 'N/A'}</strong></td>
            <td>${item.dir || 'N/A'}</td>
            <td>${item.fy || 'N/A'}</td>
            <td>${item.due || '--'}</td>
            <td><span class="badge ${badgeCls}">${item.st}</span></td>
            <td>
              <a href="https://nspires.nasaprs.com/external/solicitations/summary.do?path=&method=init&solId=${item.id}" target="_blank" rel="noopener noreferrer" style="font-size:0.85rem; color:#0b3d91;">NASA Live &rarr;</a>
            </td>
          </tr>
        `;
      }).join('');

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredRecords.length / pageSize) || 1;
      pagination.innerHTML = '';
      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = 'Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderTable(); };
      pagination.appendChild(prevBtn);

      let startP = Math.max(1, currentPage - 2);
      let endP = Math.min(totalPages, currentPage + 2);

      for (let p = startP; p <= endP; p++) {
        const pBtn = document.createElement('button');
        pBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        pBtn.textContent = p;
        pBtn.onclick = () => { currentPage = p; renderTable(); };
        pagination.appendChild(pBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = 'Next';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderTable(); };
      pagination.appendChild(nextBtn);
    }

    searchInput.addEventListener('input', filterData);
    fySelect.addEventListener('change', filterData);
    dirSelect.addEventListener('change', filterData);
    statusSelect.addEventListener('change', filterData);

    renderTable();
  </script>
</body>
